seed: 42
threads: 1
dataset:
  name: SMS Spam Collection
  url: https://archive.ics.uci.edu/static/public/228/sms+spam+collection.zip
  doi: 10.24432/C5CC84
  file: SMSSpamCollection
  zip_sha256: 1587ea43e58e82b14ff1f5425c88e17f8496bfcdb67a583dbff9eefaf9963ce3
  file_sha256: 7d039a24a6083ed9ef0f806ebad56bbb976e3aeb8de05669173bfdc4996c239d
  rows: 5574
  labels: [ham, spam]
  positive_label: spam
split:
  train: 0.70
  validation: 0.15
  test: 0.15
vectorizer:
  max_features: 5000
  ngram_range: [1, 2]
  lowercase: true
  sublinear_tf: true
  min_df: 2
logistic_regression:
  solver: liblinear
  C: 1.0
  max_iter: 1000
neural:
  hidden: 32
  epochs: 30
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0
threshold_grid: [0.05, 0.95, 0.01]
latency:
  warmups: 50
targets:
  spam_f1: 0.90
  p95_latency_ms: 50
  artifact_megabytes: 5
  quantization_f1_loss: 0.01
tracking:
  experiment: Project-SMS-Spam
